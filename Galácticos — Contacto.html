<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contacto — Galácticos</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a1c;--bg2:#0d1130;--ink:#f3ead6;--mut:#aeb0cc;--gold:#e9b45a;--cya:#5cc8ee;--line:rgba(233,180,90,.3);--wa:#25d366;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:300 17px/1.6 'Jost',system-ui,sans-serif;
background:radial-gradient(ellipse at 85% 0,#2a1d63 0,transparent 45%),radial-gradient(ellipse at 0 60%,#13204f 0,transparent 40%),var(--bg)}
h1,h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;margin:0;line-height:1.1}
.wrap{max-width:880px;margin:0 auto;padding:64px 22px 120px}
.brand{letter-spacing:.3em;font-size:14px;color:var(--gold);margin:0 0 26px}
h1{font-size:clamp(40px,8vw,72px);font-style:italic}
.lead{color:var(--mut);max-width:560px;margin:18px 0 40px}
.grid{display:grid;grid-template-columns:1fr 1.2fr;gap:40px;align-items:start}
.card{border:1px solid var(--line);border-radius:18px;padding:30px;background:rgba(13,17,48,.7)}
.card h2{font-size:30px;color:var(--gold);margin-bottom:12px}
.num{font-size:24px;font-weight:400;margin:6px 0 20px}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:12px 28px;border-radius:999px;border:0;background:var(--wa);color:#04210f;font:500 16px 'Jost',sans-serif;text-decoration:none;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
label{display:block;font-size:15px;color:var(--mut);margin:0 0 6px}
input,select,textarea{width:100%;min-height:48px;padding:12px 14px;margin-bottom:18px;border-radius:10px;border:1px solid var(--line);background:#0a0e26;color:var(--ink);font:300 16px 'Jost',sans-serif}
textarea{min-height:110px;resize:vertical}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.hint{font-size:14px;color:var(--mut);margin:14px 0 0}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;background:var(--wa);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 28px rgba(0,0,0,.5);z-index:20}
.fab:hover{filter:brightness(1.08)}
.fab svg{width:34px;height:34px;fill:#fff}
@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding-top:44px}}
</style>
</head>
<body>
<main class="wrap">
<p class="brand">GALÁCTICOS</p>
<h1>Hablemos de tu próximo viaje</h1>
<p class="lead">Contanos qué destino te interesa y te respondemos por WhatsApp.</p>
<div class="grid">
<section class="card">
<h2>Escribinos directo</h2>
<p class="num"></p>
<a class="btn" href="https://wa.me/5493885130401?text=Hola%20Gal%C3%A1cticos%2C%20quiero%20m%C3%A1s%20informaci%C3%B3n." target="_blank" rel="noopener">Abrir WhatsApp</a>
</section>
<section class="card">
<h2>O dejanos tus datos</h2>
<form id="f">
<label for="n">Nombre</label>
<input id="n" required autocomplete="name">
<label for="d">Destino de interés</label>
<select id="d">
<option>Perú</option><option>Brasil</option><option>Jamaica</option><option>México</option><option>Países Bajos</option><option>Todavía no sé</option>
</select>
<label for="m">Mensaje</label>
<textarea id="m"></textarea>
<button class="btn" type="submit">Enviar por WhatsApp</button>
</form>
</section>
</div>
</main>
<a class="fab" href="https://wa.me/5493885130401?text=Hola%20Gal%C3%A1cticos%2C%20quiero%20m%C3%A1s%20informaci%C3%B3n." target="_blank" rel="noopener" aria-label="Escribinos por WhatsApp">
<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3C9 3 3.3 8.6 3.3 15.5c0 2.4.7 4.7 1.9 6.600L3 29l7.100-2.100c1.800 1 3.800 1.500 5.900 1.500 7 0 12.700-5.600 12.700-12.500S23 3 16 3zm0 22.800c-1.900 0-3.700-.5-5.300-1.500l-.4-.2-4.200 1.200 1.300-4-.3-.4c-1.100-1.700-1.700-3.600-1.700-5.600C5.400 9.800 10.100 5.200 16 5.200s10.600 4.600 10.600 10.300S21.800 25.800 16 25.800zm5.800-7.600c-.3-.2-1.900-.9-2.200-1s-.5-.2-.7.200-.8 1-1 1.200-.4.200-.7.100c-1.900-.9-3.100-1.700-4.300-3.700-.3-.5.300-.5.900-1.600.1-.2.100-.4 0-.5l-1-2.300c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.100-.9.400-.3.300-1.200 1.200-1.200 2.800s1.200 3.300 1.400 3.500c.2.200 2.400 3.700 5.800 5.100 2.200.9 3 1 4.100.8.700-.1 1.900-.8 2.200-1.500.3-.8.300-1.400.2-1.500-.1-.2-.3-.3-.6-.4z"/></svg>
</a>
<script>
document.getElementById('f').addEventListener('submit',function(e){
e.preventDefault();
var t='Hola Galácticos, soy '+document.getElementById('n').value.trim()+'. Me interesa viajar a '+document.getElementById('d').value+'.';
var m=document.getElementById('m').value.trim();
if(m)t+=' '+m;
window.open('https://wa.me/5493885130401?text='+encodeURIComponent(t),'_blank','noopener');
});
</script>
</body>
</html>

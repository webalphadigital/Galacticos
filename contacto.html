<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiero viajar — Galácticos</title>
<link href="https://https://github.com/webalphadigital/Galacticos/edit/main/contacto.htmldisplay=swap" rel="stylesheet">
<style>
:root{--bg:#070a1c;--ink:#f3ead6;--mut:#aeb0cc;--gold:#e9b45a;--line:rgba(233,180,90,.3);--wa:#25d366;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:300 17px/1.6 'Jost',system-ui,sans-serif;
background:radial-gradient(ellipse at 85% 0,#2a1d63 0,transparent 45%),radial-gradient(ellipse at 0 70%,#13204f 0,transparent 40%),var(--bg)}
h1,h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;margin:0;line-height:1.1}
.wrap{max-width:640px;margin:0 auto;padding:56px 22px 130px}
.brand{letter-spacing:.3em;font-size:14px;color:var(--gold);margin:0 0 24px;text-decoration:none;display:inline-block}
h1{font-size:clamp(40px,8vw,66px);font-style:italic}
.lead{color:var(--mut);margin:16px 0 34px}
form{border:1px solid var(--line);border-radius:18px;padding:30px;background:rgba(13,17,48,.7)}
label,legend{display:block;font-size:15px;color:var(--mut);margin:0 0 6px;padding:0}
input,select,textarea{width:100%;min-height:48px;padding:12px 14px;margin-bottom:20px;border-radius:10px;border:1px solid var(--line);background:#0a0e26;color:var(--ink);font:300 16px 'Jost',sans-serif}
textarea{min-height:100px;resize:vertical}
fieldset{border:0;margin:0 0 6px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}
.chips label{margin:0;color:var(--ink);position:relative}
.chips input{position:absolute;opacity:0;width:1px;height:1px;margin:0;min-height:0}
.chips span{display:inline-block;padding:10px 18px;border:1px solid var(--line);border-radius:999px;cursor:pointer;min-height:44px;line-height:22px}
.chips input:checked+span{background:var(--gold);border-color:var(--gold);color:#070a1c}
.chips input:focus-visible+span{outline:2px solid var(--gold);outline-offset:3px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;width:100%;padding:12px 28px;border-radius:999px;border:0;background:var(--wa);color:#04210f;font:500 17px 'Jost',sans-serif;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.note{font-size:14px;color:var(--mut);margin:14px 0 0;text-align:center}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;background:var(--wa);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 28px rgba(0,0,0,.5);z-index:20}
.fab svg{width:34px;height:34px;fill:#fff}
@media(max-width:520px){.row{grid-template-columns:1fr}form{padding:22px}}
</style>
</head>
<body>
<main class="wrap">
<a class="brand" href="https://github.com/webalphadigital/Galacticos/edit/main/contacto.html>GALÁCTICOS</a>
<h1>Quiero viajar</h1>
<p class="lead">Elegí tu destino y contanos cuándo te gustaría salir. Te respondemos por WhatsApp.</p>
<form id="f">
<label for="n">Nombre</label>
<input id="n" required autocomplete="name">
<fieldset>
<legend>Destino de interés</legend>
<div class="chips">
<label><input type="checkbox" name="d" value="Perú"><span>Perú</span></label>
<label><input type="checkbox" name="d" value="Brasil"><span>Brasil</span></label>
<label><input type="checkbox" name="d" value="Jamaica"><span>Jamaica</span></label>
<label><input type="checkbox" name="d" value="México"><span>México</span></label>
<label><input type="checkbox" name="d" value="Países Bajos"><span>Países Bajos</span></label>
</div>
</fieldset>
<div class="row">
<div><label for="c">Cuándo querés viajar</label><input id="c" placeholder="Ej.: marzo 2027"></div>
<div><label for="p">Cantidad de viajeros</label><select id="p"><option>1</option><option>2</option><option>3 a 5</option><option>6 o más</option></select></div>
</div>
<label for="m">Algo más que quieras contarnos</label>
<textarea id="m"></textarea>
<button class="btn" type="submit">Enviar por WhatsApp</button>
<p class="note">Se abre WhatsApp con tu mensaje listo para enviar.</p>
</form>
</main>
<a class="fab" href="https://wa.me/5493885130401?text=Hola%20Gal%C3%A1cticos%2C%20quiero%20viajar." target="_blank" rel="noopener" aria-label="Escribinos por WhatsApp">
<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3C9 3 3.3 8.6 3.3 15.5c0 2.4.7 4.7 1.9 6.600L3 29l7.100-2.100c1.800 1 3.800 1.500 5.900 1.500 7 0 12.700-5.600 12.700-12.500S23 3 16 3zm0 22.800c-1.900 0-3.700-.5-5.300-1.500l-.4-.2-4.200 1.200 1.300-4-.3-.4c-1.100-1.700-1.700-3.600-1.700-5.600C5.400 9.800 10.100 5.200 16 5.200s10.600 4.600 10.600 10.300S21.800 25.800 16 25.800zm5.800-7.600c-.3-.2-1.900-.9-2.200-1s-.5-.2-.7.200-.8 1-1 1.200-.4.200-.7.100c-1.900-.9-3.100-1.700-4.300-3.700-.3-.5.300-.5.900-1.600.1-.2.100-.4 0-.5l-1-2.300c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.100-.9.400-.3.300-1.200 1.200-1.200 2.800s1.200 3.300 1.400 3.500c.2.200 2.400 3.700 5.800 5.100 2.200.9 3 1 4.100.8.700-.1 1.900-.8 2.200-1.500.3-.8.300-1.400.2-1.500-.1-.2-.3-.3-.6-.4z"/></svg>
</a>
<script>
document.getElementById('f').addEventListener('submit',function(e){
e.preventDefault();
var d=[].slice.call(document.querySelectorAll('input[name=d]:checked')).map(function(x){return x.value});
var t='Hola Galácticos, soy '+document.getElementById('n').value.trim()+'. Quiero viajar'+(d.length?' a '+d.join(', '):'')+'.';
var c=document.getElementById('c').value.trim();
if(c)t+=' Fecha: '+c+'.';
t+=' Viajeros: '+document.getElementById('p').value+'.';
var m=document.getElementById('m').value.trim();
if(m)t+=' '+m;
window.open('https://wa.me/5493885130401?text='+encodeURIComponent(t),'_blank','noopener');
});
</script>
</body>
</html>
